schema_version = "1.4"

[task]
name = "holoskill/codeopt-train-001"
version = "1.0.0"
description = "prefix-caching code optimization on a pinned local repository"
keywords = ["optimization", "programming", "prefix-caching"]

[metadata]
category = "programming"
benchmark_trust = "synthetic_canary"
difficulty = "medium"
difficulty_explanation = "Single hot path; the win is algorithmic, not incidental."
holoskill_family = "prefix-caching"
holoskill_module = "src/prefix_cache.py"
holoskill_benchmark_metric = "encode_throughput_units"
holoskill_optimization_direction = "maximize"

[agent]
timeout_sec = 1200.0
user = "root"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]

[verifier]
timeout_sec = 600.0
user = "root"
network_mode = "no-network"

[environment]
network_mode = "allowlist"
allowed_hosts = ["deb.debian.org", "security.debian.org", "registry.npmjs.org", "nodejs.org", "raw.githubusercontent.com", "downloads.claude.ai"]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
