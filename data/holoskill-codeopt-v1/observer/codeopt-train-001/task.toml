schema_version = "1.4"

[task]
name = "holoskill/codeopt-train-001"
version = "1.0.0"
description = "prefix-caching code optimization on a pinned local repository"
keywords = ["optimization", "programming", "prefix-caching"]

[metadata]
category = "programming"
difficulty = "medium"
difficulty_explanation = "Single hot path; the win is algorithmic, not incidental."
holoskill_family = "prefix-caching"
holoskill_module = "src/prefix_cache.py"
holoskill_benchmark_metric = "encode_throughput_units"
holoskill_optimization_direction = "maximize"

[agent]
timeout_sec = 1200.0
user = "root"

[verifier]
timeout_sec = 600.0
user = "root"

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
