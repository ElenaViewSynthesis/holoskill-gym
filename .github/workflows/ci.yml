name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize required vendored dependencies
        run: bash scripts/bootstrap-vendor
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # setup-uv stopped publishing major/minor tags at v8; pin the exact version.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Apply and verify vendor patches
        run: |
          bash scripts/bootstrap-vendor --check
          bash scripts/apply-vendor-patches
          bash scripts/apply-vendor-patches --check
      - name: Verify generated files and lock
        run: |
          uv lock --check
          scripts/render-harbor-task-verifiers --check
          git diff --check
      - name: Lint and test
        run: |
          uv run ruff check holoskill_gym tests scripts/render-harbor-task-verifiers scripts/scan-artifacts scripts/sanitize-harbor-logs
          uv run pytest -q

  harbor-oracle:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: train-001
            task: data/holoskill-codeopt-v1/observer/codeopt-train-001
          - id: train-002
            task: data/holoskill-codeopt-v1/observer/codeopt-train-002
          - id: val-001
            task: data/holoskill-codeopt-v1/observer/codeopt-val-001
          - id: test-001
            task: data/holoskill-codeopt-v1/observer/codeopt-test-001
          - id: gate-001
            task: data/holoskill-codeopt-v1/private_gate/codeopt-gate-001
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize required vendored dependencies
        run: bash scripts/bootstrap-vendor
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Prepare patched Harbor
        run: |
          bash scripts/bootstrap-vendor --check
          bash scripts/apply-vendor-patches
      - name: Run credential-free oracle
        run: uv run harbor run -p "${{ matrix.task }}" -a oracle -y
      - name: Sanitize failure logs
        id: sanitize-failure-logs
        if: failure()
        run: uv run python scripts/sanitize-harbor-logs jobs/ sanitized-logs/
      - name: Scan raw generated artifacts (never upload)
        id: raw-artifact-scan
        if: always()
        run: uv run python scripts/scan-artifacts jobs/
      - name: Scan sanitized failure logs
        id: sanitized-artifact-scan
        if: always() && steps.sanitize-failure-logs.outcome == 'success'
        run: uv run python scripts/scan-artifacts sanitized-logs/
      - name: Retain sanitized failure logs
        if: >-
          always() && failure() &&
          steps.sanitize-failure-logs.outcome == 'success' &&
          steps.sanitized-artifact-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: harbor-failure-${{ matrix.id }}
          path: sanitized-logs/
          if-no-files-found: ignore
          retention-days: 7
